<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب | مركز التابعين</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@300;500;800;900&display=swap');
        
        :root { --navy: #0a0f1d; --gold: #af945d; --soft-bg: #f4f7f9; }
        
        body { font-family: 'Tajawal', sans-serif; background-color: var(--soft-bg); color: var(--navy); transition: 0.5s; }
        
        /* ميزة الوضع الليلي */
        body.night-mode { background-color: #020617; color: #f1f5f9; }
        body.night-mode .glass-card { background: rgba(15, 23, 42, 0.8); border-color: #1e293b; }

        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 40px; border: 1px solid rgba(175, 148, 93, 0.2); shadow: 0 20px 40px rgba(0,0,0,0.05); }
        
        .gold-text { background: linear-gradient(135deg, #8A6E2F, #C5A059); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Amiri', serif; }

        /* رحلة الإنجاز التفاعلية (The Journey) */
        .timeline-container { position: relative; padding: 20px 0; }
        .timeline-line { position: absolute; right: 20px; top: 0; bottom: 0; width: 4px; background: linear-gradient(to bottom, var(--gold), transparent); }
        .step-node { position: relative; margin-bottom: 50px; padding-right: 50px; }
        .step-circle { position: absolute; right: 10px; top: 0; width: 24px; height: 24px; background: var(--navy); border: 4px solid var(--gold); border-radius: 50%; z-index: 10; transition: 0.3s; }
        .step-node.active .step-circle { background: var(--gold); transform: scale(1.3); box-shadow: 0 0 15px var(--gold); }

        /* بطاقة التميز للتحميل */
        #excellence-card-ui { 
            background: linear-gradient(135deg, #0a0f1d 0%, #1a2a44 100%);
            border: 3px solid var(--gold);
            border-radius: 30px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .card-pattern { position: absolute; top: -50px; left: -50px; width: 200px; height: 200px; background: var(--gold); opacity: 0.05; border-radius: 50%; }

        .btn-portal { background: var(--navy); color: white; border-radius: 20px; padding: 12px 25px; font-weight: 800; transition: 0.3s; }
        .btn-portal:hover { background: var(--gold); transform: translateY(-3px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-3">
                <i class="fas fa-star-and-crescent text-3xl text-gold"></i>
                <h1 class="text-2xl font-black italic">بوابة <span class="text-gold">التابعین</span></h1>
            </div>
            <div class="flex gap-3">
                <button onclick="document.body.classList.toggle('night-mode')" class="w-12 h-12 glass-card flex items-center justify-center hover:text-gold transition text-xl">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="index.html" class="w-12 h-12 glass-card flex items-center justify-center hover:text-gold transition text-xl">
                    <i class="fas fa-home"></i>
                </a>
            </div>
        </header>

        <div class="glass-card p-8 mb-10 border-r-8 border-gold animate__animated animate__fadeInDown">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Message of Inspiration</p>
            <h3 id="daily-msg" class="text-xl font-bold italic text-slate-700">"القرآن ربيع القلوب ونور الصدور، فاجعل لنفسك منه نصيباً في كل يوم."</h3>
        </div>

        <main class="grid grid-cols-1 gap-10">
            
            <section class="text-center">
                <h2 class="text-2xl font-black mb-6 italic"><i class="fas fa-id-card-clip text-gold ml-2"></i> بطاقة <span class="gold-text text-3xl">الفخر</span> الرقمية</h2>
                
                <div id="excellence-card-ui" class="animate__animated animate__zoomIn shadow-2xl">
                    <div class="card-pattern"></div>
                    <div class="relative z-10 flex flex-col md:flex-row items-center justify-between text-right">
                        <div class="space-y-4">
                            <span class="text-[10px] bg-gold/20 text-gold px-4 py-1 rounded-full font-black uppercase">Official Achievement</span>
                            <h2 id="card-name" class="text-5xl font-black gold-text">-- الاسم --</h2>
                            <p id="card-mentor" class="text-slate-400 font-bold italic"></p>
                            <div class="flex gap-4 mt-6">
                                <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-center min-w-[80px]">
                                    <span class="text-[8px] block opacity-50 text-white">الأجزاء</span>
                                    <span id="card-parts" class="text-2xl font-black text-gold">0</span>
                                </div>
                                <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-center min-w-[80px]">
                                    <span class="text-[8px] block opacity-50 text-white">التقييم</span>
                                    <span id="card-grade" class="text-2xl font-black text-green-400">A+</span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-8 md:mt-0 opacity-20">
                            <i class="fas fa-quran text-[150px] text-white"></i>
                        </div>
                    </div>
                    <div class="mt-10 pt-6 border-t border-white/10 text-center">
                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-[5px]">Markaz Al-Tabeen • 2026</p>
                    </div>
                </div>
                
                <button onclick="downloadAchievement()" class="mt-8 btn-portal px-10 py-4 shadow-xl">
                    تحميل بطاقة التميز <i class="fas fa-download ml-2"></i>
                </button>
            </section>

            <section class="glass-card p-10">
                <h3 class="text-2xl font-black mb-10 flex items-center gap-3 italic text-gold">
                    <i class="fas fa-route"></i> خارطة الطريق إلى الختمة
                </h3>
                
                <div class="timeline-container mr-4">
                    <div class="timeline-line"></div>
                    
                    <div id="journey-steps" class="space-y-2">
                        </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        // دالة جلب البيانات من الذاكرة المحلية (التي خزنها نظام الدخول في index.html)
        function loadStudentData() {
            const currentStudent = JSON.parse(localStorage.getItem('current_active_student') || '{}');
            
            if(!currentStudent.name) {
                alert("لم يتم العثور على بيانات، يرجى الدخول من الصفحة الرئيسية");
                window.location.href = "index.html";
                return;
            }

            // تعبئة البطاقة
            document.getElementById('card-name').innerText = currentStudent.name;
            document.getElementById('card-mentor').innerText = "بإشراف المحفظ: " + currentStudent.mentor;
            document.getElementById('card-parts').innerText = currentStudent.parts;
            document.getElementById('card-grade').innerText = currentStudent.grade || "ممتاز";

            // بناء الرحلة التفاعلية (Interactive Journey)
            const journeyBox = document.getElementById('journey-steps');
            const totalParts = 30;
            const completedParts = parseInt(currentStudent.parts) || 0;

            for(let i = 1; i <= 5; i++) { // نعرض 5 محطات رئيسية كمثال
                const partThreshold = i * 6;
                const isActive = completedParts >= partThreshold;
                
                journeyBox.innerHTML += `
                    <div class="step-node ${isActive ? 'active' : ''} animate__animated animate__fadeInRight">
                        <div class="step-circle"></div>
                        <h4 class="font-black text-lg ${isActive ? 'text-gold' : 'text-slate-400'}">محطة الجزء ${partThreshold}</h4>
                        <p class="text-sm font-bold opacity-70">${isActive ? 'تم اجتياز هذه المرحلة بنجاح' : 'قريباً إن شاء الله'}</p>
                    </div>
                `;
            }
        }

        // دالة تحميل البطاقة كصورة
        function downloadAchievement() {
            const card = document.getElementById('excellence-card-ui');
            html2canvas(card, { 
                scale: 3, 
                backgroundColor: null,
                useCORS: true 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `achievement_tabeen_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        window.onload = loadStudentData;
    </script>
</body>
</html>
