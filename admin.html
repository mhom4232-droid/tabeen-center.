<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم للمعلم | التابعين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap'); body{font-family:'Tajawal'; background:#0f172a; color:white;}</style>
</head>
<body class="p-6">
    <div class="max-w-2xl mx-auto space-y-8">
        <header class="text-center space-y-2">
            <h1 class="text-3xl font-black text-amber-400">بوابة المحفظ الذكية</h1>
            <p class="text-slate-400 font-bold">تحديث سجل الطالب في قاعدة البيانات المركزية</p>
        </header>

        <form id="updateForm" class="bg-slate-800 p-8 rounded-[40px] shadow-2xl space-y-5 border border-slate-700">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-amber-500">كود الطالب (ID)</label>
                    <input type="number" id="id" required class="w-full bg-slate-900 border-none p-4 rounded-2xl outline-none ring-1 ring-slate-700 focus:ring-amber-500 font-bold text-center text-xl">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-amber-500">الأجزاء المحفوظة</label>
                    <input type="number" id="parts" required class="w-full bg-slate-900 border-none p-4 rounded-2xl outline-none ring-1 ring-slate-700 focus:ring-amber-500 font-bold text-center text-xl">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-black uppercase text-amber-500">مقرر اليوم (تسميع)</label>
                <input type="text" id="today" required class="w-full bg-slate-900 border-none p-4 rounded-2xl outline-none ring-1 ring-slate-700 focus:ring-amber-500 font-bold">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-black uppercase text-amber-500">التقييم العام</label>
                <select id="grade" class="w-full bg-slate-900 border-none p-4 rounded-2xl outline-none ring-1 ring-slate-700 focus:ring-amber-500 font-black">
                    <option>ممتاز 🌟</option>
                    <option>جيد جداً 👍</option>
                    <option>جيد 🆗</option>
                    <option>يحتاج مراجعة ⚠️</option>
                </select>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-black uppercase text-amber-500">رسالة للطالب / ولي الأمر</label>
                <textarea id="msg" class="w-full bg-slate-900 border-none p-4 rounded-2xl outline-none ring-1 ring-slate-700 focus:ring-amber-500 font-bold h-24"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-amber-500 text-blue-950 py-5 rounded-2xl font-black text-lg shadow-xl shadow-amber-500/20 active:scale-95 transition-all">تحديث السجل الآن <i class="fas fa-cloud-upload-alt mr-2"></i></button>
        </form>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxac2itl7P_W2CtSmSwOufBqvkmOsoZEHxo2z5TZ2Y4YpB60YhKVJGXMlQjZKeFRHN52g/exec";

        document.getElementById('updateForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري المزامنة...';

            const payload = {
                action: "updateStudent",
                id: document.getElementById('id').value,
                parts: document.getElementById('parts').value,
                today: document.getElementById('today').value,
                grade: document.getElementById('grade').value,
                msg: document.getElementById('msg').value
            };

            try {
                // إرسال البيانات (تأكد أن السكريبت يدعم POST واستقبال JSON)
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), mode: 'no-cors' });
                alert("تم تحديث السجل بنجاح! ✅");
                e.target.reset();
            } catch(e) { alert("فشل الاتصال بالسيرفر!"); }
            btn.innerText = "تحديث السجل الآن";
        };
    </script>
</body>
</html>
