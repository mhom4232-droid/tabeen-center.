<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مركز التابعين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; color: #1a1a1a; }
        .admin-card { background: white; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
        .tab-active { background: #0a0f1d; color: white; border-radius: 15px; }
        .hidden-section { display: none; }
        .input-gold { width: 100%; padding: 15px; background: #f8fafc; border: 2px solid #edf2f7; border-radius: 15px; outline: none; transition: 0.3s; font-weight: bold; }
        .input-gold:focus { border-color: #af945d; background: white; }
        .btn-action { background: #0a0f1d; color: white; padding: 15px 30px; border-radius: 15px; font-weight: 900; transition: 0.3s; cursor: pointer; text-align: center; }
        .btn-action:hover { background: #af945d; transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <div id="auth-screen" class="admin-card p-12 text-center max-w-md mx-auto mt-20 animate__animated animate__zoomIn">
            <div class="w-20 h-20 bg-slate-900 rounded-3xl flex items-center justify-center text-white text-3xl mx-auto mb-6 shadow-xl">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-black mb-6">تسجيل دخول الأنظمة</h2>
            <input type="password" id="systemKey" placeholder="أدخل كلمة المرور السرية" class="input-gold text-center text-2xl mb-6">
            <button onclick="adminCore.auth()" class="btn-action w-full">دخول آمن</button>
            <p class="text-[10px] text-slate-400 mt-6 font-bold">نظام محمي - مركز التابعين 2026</p>
        </div>

        <div id="main-dashboard" class="hidden-section space-y-8 animate__animated animate__fadeIn">
            <header class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <h1 class="text-3xl font-black" id="welcome-msg">مرحباً بك</h1>
                    <p class="text-gold font-black italic" id="role-tag"></p>
                </div>
                <div class="flex gap-2">
                    <a href="index.html" class="px-6 py-3 bg-white rounded-xl font-bold border hover:bg-slate-50 transition">معاينة الموقع</a>
                    <button onclick="location.reload()" class="px-6 py-3 bg-red-50 text-red-600 rounded-xl font-bold">خروج</button>
                </div>
            </header>

            <div class="flex gap-4 overflow-x-auto pb-2" id="nav-tabs">
                <button onclick="adminCore.switchTab('students')" id="btn-students" class="px-6 py-3 font-black tab-active">إدارة الطلاب</button>
                <button onclick="adminCore.switchTab('media')" id="btn-media" class="px-6 py-3 font-black hidden-section">الوسائط والصور</button>
                <button onclick="adminCore.switchTab('settings')" id="btn-settings" class="px-6 py-3 font-black hidden-section">إعدادات الموقع</button>
            </div>

            <section id="sec-students" class="admin-card p-8 space-y-6">
                <h3 class="text-xl font-black border-r-4 border-gold pr-4">سجلات الحلقات</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="number" id="std-id" placeholder="كود الطالب" class="input-gold">
                    <select id="std-mentor" class="input-gold">
                        <option>ناهض العصار</option> <option>محمد العصار</option>
                        <option>أحمد جحجوح</option> <option>أحمد يونس</option>
                        <option>قصي يونس</option> <option>محمود العمصي</option>
                    </select>
                    <input type="number" id="std-parts" placeholder="عدد الأجزاء" class="input-gold">
                    <select id="std-grade" class="input-gold">
                        <option>امتياز ✨</option> <option>جيد جداً 👍</option> <option>جيد 🆗</option>
                    </select>
                    <textarea id="std-msg" placeholder="رسالة تشجيعية أو مقرر اليوم" class="input-gold md:col-span-2" rows="3"></textarea>
                </div>
                <button onclick="adminCore.updateStudent()" class="btn-action w-full">تحديث السجل السحابي</button>
            </section>

            <section id="sec-media" class="hidden-section admin-card p-8 space-y-6">
                <h3 class="text-xl font-black border-r-4 border-blue-600 pr-4 text-blue-600">إدارة الصور</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="p-6 border-2 border-dashed border-slate-200 rounded-3xl text-center">
                        <i class="fas fa-cloud-upload-alt text-4xl text-slate-300 mb-4"></i>
                        <p class="font-bold text-slate-500 mb-4">رفع من الجهاز</p>
                        <input type="file" id="file-upload" class="hidden" accept="image/*" onchange="adminCore.handleFile(event)">
                        <button onclick="document.getElementById('file-upload').click()" class="bg-slate-100 px-6 py-2 rounded-xl font-black text-sm">اختيار ملف</button>
                    </div>
                    <div>
                        <p class="font-bold text-slate-500 mb-4">أو رابط من الإنترنت</p>
                        <input type="text" id="img-url" placeholder="ضع رابط الصورة هنا" class="input-gold mb-4">
                        <button onclick="adminCore.addImgLink()" class="btn-action w-full py-3 text-sm">إضافة الرابط</button>
                    </div>
                </div>
            </section>

            <section id="sec-settings" class="hidden-section admin-card p-8 space-y-6">
                <h3 class="text-xl font-black border-r-4 border-amber-500 pr-4 text-amber-500">التحكم في المحتوى</h3>
                <div>
                    <label class="block font-black text-sm mb-2">شريط الإعلانات العلوية</label>
                    <textarea id="ticker-input" class="input-gold" rows="3" placeholder="اكتب نص شريط الأخبار..."></textarea>
                </div>
                <button onclick="adminCore.saveSettings()" class="btn-action w-full bg-amber-500">تحديث واجهة الموقع</button>
            </section>
        </div>
    </div>

    <script>
        // نظام كلمات المرور المنفصلة
        const ACCESS_KEYS = {
            "ADMIN_MASTER_2026": { role: "المدير العام", level: 2 },
            "MENTOR_NAHED": { role: "المحفظ ناهض العصار", level: 1 },
            "MENTOR_MOHAMMED": { role: "المحفظ محمد العصار", level: 1 },
            "MENTOR_AHMED": { role: "المحفظ أحمد يونس", level: 1 }
        };

        const adminCore = {
            currentLevel: 0,

            auth() {
                const key = document.getElementById('systemKey').value;
                const user = ACCESS_KEYS[key];
                if(user) {
                    this.currentLevel = user.level;
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-dashboard').classList.remove('hidden-section');
                    document.getElementById('welcome-msg').innerText = "مرحباً: " + user.role;
                    document.getElementById('role-tag').innerText = (user.level === 2) ? "صلاحيات كاملة" : "صلاحيات محددة";
                    
                    if(user.level === 2) {
                        document.getElementById('btn-media').classList.remove('hidden-section');
                        document.getElementById('btn-settings').classList.remove('hidden-section');
                    }
                } else { alert("كلمة المرور غير صحيحة!"); }
            },

            switchTab(tabId) {
                document.querySelectorAll('section').forEach(s => s.classList.add('hidden-section'));
                document.querySelectorAll('#nav-tabs button').forEach(b => b.classList.remove('tab-active'));
                document.getElementById('sec-' + tabId).classList.remove('hidden-section');
                document.getElementById('btn-' + tabId).classList.add('tab-active');
            },

            // ميزة رفع الملفات من الجهاز
            handleFile(event) {
                const file = event.target.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = JSON.parse(localStorage.getItem('tabeen_data') || '{"images":[]}');
                    data.images.push(e.target.result);
                    localStorage.setItem('tabeen_data', JSON.stringify(data));
                    alert("تم رفع الصورة بنجاح!");
                };
                reader.readAsDataURL(file);
            },

            addImgLink() {
                const url = document.getElementById('img-url').value;
                if(!url) return;
                const data = JSON.parse(localStorage.getItem('tabeen_data') || '{"images":[]}');
                data.images.push(url);
                localStorage.setItem('tabeen_data', JSON.stringify(data));
                alert("تم إضافة الرابط!");
                document.getElementById('img-url').value = "";
            },

            saveSettings() {
                const ticker = document.getElementById('ticker-input').value;
                const data = JSON.parse(localStorage.getItem('tabeen_data') || '{}');
                data.ticker = ticker;
                localStorage.setItem('tabeen_data', JSON.stringify(data));
                alert("تم تحديث إعدادات الموقع بنجاح!");
            },

            updateStudent() {
                // هنا يتم الربط مع Google Sheets في المرحلة النهائية
                alert("تم إرسال بيانات الطالب للسحابة الإلكترونية بنجاح!");
            }
        };
    </script>
</body>
</html>
