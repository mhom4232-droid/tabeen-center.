<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة التابعين | لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f1f5f9; }
        .admin-card { background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-black text-slate-900">غرفة التحكم المركزي</h1>
                <p class="text-slate-500 font-bold italic">تحديث سجلات الطلاب والمساجد</p>
            </div>
            <a href="index.html" class="bg-white px-6 py-3 rounded-xl font-bold border shadow-sm hover:bg-slate-50">رجوع للموقع</a>
        </header>

        <div class="admin-card p-10">
            <form id="adminForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-black text-slate-400 mb-2 uppercase">كود الطالب</label>
                        <input type="number" id="admID" required class="w-full p-4 bg-slate-50 border rounded-xl outline-none focus:border-blue-500 font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-400 mb-2 uppercase">المحفظ المسؤول</label>
                        <select id="admMentor" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold">
                            <option>ناهض العصار</option>
                            <option>محمد العصار</option>
                            <option>أحمد يونس</option>
                            <option>أحمد جحجوح</option>
                            <option>قصي يونس</option>
                            <option>محمود العمصي</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-black text-slate-400 mb-2 uppercase">المسجد</label>
                        <select id="admMosque" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold">
                            <option>مسجد التابعين الرئيسي</option>
                            <option>مسجد معاذ بن جبل</option>
                            <option>مسجد التابعين للنساء</option>
                            <option>مسجد ذو النورين</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-400 mb-2 uppercase">عدد الأجزاء</label>
                        <input type="number" id="admParts" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-400 mb-2 uppercase">التقييم اليومي</label>
                        <select id="admGrade" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold">
                            <option>ممتاز ✨</option>
                            <option>جيد جداً 👍</option>
                            <option>جيد 🆗</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2 uppercase">مقرر اليوم / رسالة للطالب</label>
                    <textarea id="admMsg" rows="3" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold" placeholder="مثلاً: حفظ سورة البقرة من 1-20"></textarea>
                </div>

                <button type="submit" id="subBtn" class="w-full py-5 bg-slate-900 text-white rounded-2xl font-black text-xl hover:bg-[#af945d] transition-all shadow-xl">
                    تحديث السجل المركزي <i class="fas fa-cloud-upload-alt ml-2"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbwZ7HP6Y9z_zlxccx5wn-mcn6xIy3ytUAs2oQH9ft70ImIcENSzXSYZUdv1PaG3YLH2KA/exec";

        document.getElementById('adminForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري المزامنة...';

            const payload = {
                action: "updateStudent",
                id: document.getElementById('admID').value,
                mentor: document.getElementById('admMentor').value,
                mosque: document.getElementById('admMosque').value,
                parts: document.getElementById('admParts').value,
                grade: document.getElementById('admGrade').value,
                msg: document.getElementById('admMsg').value
            };

            try {
                // إرسال البيانات عبر POST لجوجل شيت
                await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert("تم تحديث بيانات الطالب بنجاح!");
                e.target.reset();
            } catch(err) {
                alert("خطأ في التحديث");
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'تحديث السجل المركزي <i class="fas fa-cloud-upload-alt ml-2"></i>';
            }
        };
    </script>
</body>
