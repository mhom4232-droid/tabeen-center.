<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التابعين | لوحة المحفظ الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap');
        :root { --p-blue: #0f172a; --gold: #c5a059; }
        body { font-family: 'Tajawal', sans-serif; background: #020617; color: white; overflow-x: hidden; }
        
        .imperial-border { border: 1px solid rgba(197, 160, 89, 0.3); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; color: white; transition: 0.3s; }
        .glass-input:focus { background: rgba(255, 255, 255, 0.1); border-color: var(--gold); outline: none; }
        
        .admin-card { background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        .btn-gold { background: linear-gradient(135deg, #c5a059, #a38241); color: #0f172a; font-weight: 900; transition: 0.4s; }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(197, 160, 89, 0.3); }

        .nav-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-radius: 30px; display: flex; justify-content: space-around; padding: 15px; border: 1px solid var(--gold); }
    </style>
</head>
<body class="p-4 pb-32">

    <header class="max-w-2xl mx-auto py-8 text-center space-y-2">
        <div class="inline-block p-4 rounded-3xl bg-slate-800 border border-gold/20 mb-4">
            <i class="fas fa-user-shield text-4xl text-gold"></i>
        </div>
        <h1 class="text-3xl font-black tracking-tight">بوابة المعلم الذكية</h1>
        <p class="text-slate-400 font-bold text-sm">مركز التابعين - نظام الإدارة الإمبراطوري</p>
    </header>

    <main class="max-w-2xl mx-auto">
        <div class="admin-card p-8 imperial-border space-y-8 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-gold/5 rounded-full blur-3xl"></div>
            
            <form id="updateForm" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gold uppercase mr-2">المسجد</label>
                        <select id="mosque" class="w-full p-4 glass-input text-sm font-bold appearance-none">
                            <option>المقر الرئيسي - التابعين</option>
                            <option>مسجد معاذ بن جبل</option>
                            <option>مسجد التابعين (للمحفظات)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gold uppercase mr-2">المحفظ</label>
                        <select id="mentor" class="w-full p-4 glass-input text-sm font-bold">
                            <option>ناهض العصار</option>
                            <option>أحمد يونس</option>
                            <option>محمد العصار</option>
                            <option>أحمد جحجوح</option>
                            <option>محمود العمصي</option>
                            <option>أفنان أبو الحسن</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gold uppercase mr-2">كود الطالب المستهدف</label>
                    <input type="number" id="stdID" placeholder="000000" required
                        class="w-full p-5 glass-input text-2xl font-black text-center tracking-[0.3em]">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gold uppercase mr-2">عدد الأجزاء الحالية</label>
                        <input type="number" id="parts" placeholder="مثلاً: 15" required
                            class="w-full p-4 glass-input font-bold text-center">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gold uppercase mr-2">التقييم اليومي</label>
                        <select id="grade" class="w-full p-4 glass-input font-bold">
                            <option>ممتاز ✨</option>
                            <option>جيد جداً 👍</option>
                            <option>جيد 🆗</option>
                            <option>يحتاج مراجعة ⚠️</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2 relative">
                    <label class="text-[10px] font-black text-gold uppercase mr-2 flex justify-between">
                        <span>مقرر اليوم (تسميع/مراجعة)</span>
                        <button type="button" onclick="dictate('today')" class="text-green-400 hover:text-green-300">
                            <i class="fas fa-microphone"></i> إملاء
                        </button>
                    </label>
                    <input type="text" id="today" placeholder="سورة البقرة من 1 إلى 50" required
                        class="w-full p-4 glass-input font-bold">
                </div>

                <div class="space-y-2 relative">
                    <label class="text-[10px] font-black text-gold uppercase mr-2 flex justify-between">
                        <span>رسالة خاصة للطالب</span>
                        <button type="button" onclick="dictate('msg')" class="text-green-400 hover:text-green-300">
                            <i class="fas fa-microphone"></i> إملاء
                        </button>
                    </label>
                    <textarea id="msg" placeholder="اكتب ملاحظاتك أو تشجيعك هنا..." 
                        class="w-full p-4 glass-input font-bold h-24 resize-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" 
                    class="w-full py-5 btn-gold rounded-[25px] text-lg shadow-2xl flex items-center justify-center gap-3 active:scale-95 transition-all">
                    تحديث سجل الطالب <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <nav class="nav-dock">
        <a href="index.html" class="text-white/50 text-xl hover:text-gold"><i class="fas fa-home"></i></a>
        <a href="admin.html" class="text-gold text-xl"><i class="fas fa-user-shield"></i></a>
        <a href="circles.html" class="text-white/50 text-xl hover:text-gold"><i class="fas fa-mosque"></i></a>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxac2itl7P_W2CtSmSwOufBqvkmOsoZEHxo2z5TZ2Y4YpB60YhKVJGXMlQjZKeFRHN52g/exec";

        // وظيفة الإملاء الصوتي الذكية للمحفظ
        function dictate(fieldId) {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'ar-SA';
            recognition.start();
            
            const field = document.getElementById(fieldId);
            field.placeholder = "جاري الاستماع لصوتك...";
            
            recognition.onresult = (e) => {
                field.value = e.results[0][0].transcript;
            };
        }

        // معالجة إرسال البيانات
        document.getElementById('updateForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري مزامنة البيانات...';

            const payload = {
                action: "updateStudent",
                id: document.getElementById('stdID').value,
                mosque: document.getElementById('mosque').value,
                mentor: document.getElementById('mentor').value,
                parts: document.getElementById('parts').value,
                today: document.getElementById('today').value,
                grade: document.getElementById('grade').value,
                msg: document.getElementById('msg').value
            };

            try {
                // إرسال البيانات لـ Google Sheets
                // ملاحظة: نستخدم fetch مع وضع mode: 'no-cors' لأن Apps Script يواجه مشاكل CORS أحياناً
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });

                alert("تم تحديث بيانات الطالب بنجاح في السجلات الإمبراطورية! ✅");
                document.getElementById('updateForm').reset();
            } catch (err) {
                alert("حدث خطأ في الاتصال، تأكد من إعدادات الـ Script.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'تحديث سجل الطالب <i class="fas fa-paper-plane"></i>';
            }
        };
    </script>
</body>
</html>
