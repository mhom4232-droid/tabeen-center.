<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التابعين | غرفة العمليات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: #f1f5f9; color: #0f172a; }
        .admin-sidebar { background: #0f172a; height: 100vh; position: sticky; top: 0; }
        .glass-input { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem; width: 100%; transition: 0.3s; }
        .glass-input:focus { border-color: #c5a059; outline: none; box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.1); }
        @media (max-width: 768px) { .admin-sidebar { display: none; } }
    </style>
</head>
<body class="flex flex-col md:flex-row">

    <aside class="admin-sidebar w-64 p-6 hidden md:block">
        <h1 class="text-white font-black text-xl mb-10 tracking-tighter">التابعين <span class="text-gold-royal block text-[10px]">ADMIN PANEL</span></h1>
        <nav class="space-y-4">
            <a href="#" class="block text-white bg-white/10 p-4 rounded-xl font-bold"><i class="fas fa-users-gear ml-2"></i> إدارة الطلاب</a>
            <a href="index.html" class="block text-white/50 p-4 rounded-xl font-bold hover:text-white transition-all"><i class="fas fa-home ml-2"></i> الموقع الرئيسي</a>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-10">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-2xl font-black">تحديث سجلات الحلقات</h2>
                <p class="text-slate-500 text-sm font-medium">أهلاً بك، فضيلة المحفظ</p>
            </div>
            <div class="w-12 h-12 bg-white rounded-xl shadow-sm border flex items-center justify-center"><i class="fas fa-user-tie"></i></div>
        </header>

        <section class="max-w-4xl bg-white p-8 md:p-12 rounded-[30px] shadow-xl border border-slate-100">
            <form id="updateForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="col-span-1 md:col-span-2 space-y-2">
                    <label class="font-black text-xs text-slate-400 uppercase tracking-widest mr-2">كود الطالب المستهدف</label>
                    <input type="number" id="stdID" placeholder="000000" required class="glass-input text-center text-2xl font-black tracking-widest">
                </div>

                <div class="space-y-2">
                    <label class="font-black text-xs text-slate-400 mr-2">المسجد / الحلقة</label>
                    <select id="mosque" class="glass-input font-bold appearance-none">
                        <option>المقر الرئيسي - مسجد التابعين</option>
                        <option>مسجد معاذ بن جبل</option>
                        <option>مسجد ذو النورين</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="font-black text-xs text-slate-400 mr-2">المحفظ المسؤول</label>
                    <select id="mentor" class="glass-input font-bold">
                        <option>ناهض العصار</option>
                        <option>أحمد يونس</option>
                        <option>محمد العصار</option>
                        <option>محمود العمصي</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="font-black text-xs text-slate-400 mr-2">عدد الأجزاء المنجزة</label>
                    <input type="number" id="parts" placeholder="مثال: 12" class="glass-input font-bold">
                </div>

                <div class="space-y-2">
                    <label class="font-black text-xs text-slate-400 mr-2">التقييم اليومي</label>
                    <select id="grade" class="glass-input font-bold">
                        <option>ممتاز (A+)</option>
                        <option>جيد جداً (B+)</option>
                        <option>جيد (C)</option>
                        <option>ضعيف (D)</option>
                    </select>
                </div>

                <div class="col-span-1 md:col-span-2 space-y-2">
                    <label class="font-black text-xs text-slate-400 mr-2">مقرر اليوم (تسميع/مراجعة)</label>
                    <input type="text" id="today" placeholder="سورة البقرة من 1 إلى 50" class="glass-input font-bold">
                </div>

                <div class="col-span-1 md:col-span-2 space-y-2">
                    <label class="font-black text-xs text-slate-400 mr-2">رسالة توجيهية للطالب</label>
                    <textarea id="msg" class="glass-input h-32 resize-none" placeholder="اكتب تشجيعك أو ملاحظاتك هنا..."></textarea>
                </div>

                <button type="submit" id="subBtn" class="col-span-1 md:col-span-2 py-5 bg-slate-900 text-white rounded-2xl font-black text-lg hover:bg-black transition-all shadow-xl active:scale-95">
                    مزامنة وتحديث البيانات <i class="fas fa-sync-alt mr-2"></i>
                </button>

            </form>
        </section>
    </main>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbwZ7HP6Y9z_zlxccx5wn-mcn6xIy3ytUAs2oQH9ft70ImIcENSzXSYZUdv1PaG3YLH2KA/exec";

        document.getElementById('updateForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري المزامنة...';
            btn.disabled = true;

            const payload = {
                action: "updateStudent",
                id: document.getElementById('stdID').value,
                mosque: document.getElementById('mosque').value,
                mentor: document.getElementById('mentor').value,
                parts: document.getElementById('parts').value,
                grade: document.getElementById('grade').value,
                today: document.getElementById('today').value,
                msg: document.getElementById('msg').value
            };

            try {
                await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert("تم تحديث السجل الرسمي للطالب بنجاح!");
                document.getElementById('updateForm').reset();
            } catch (err) {
                alert("حدث خطأ في الاتصال بالسيرفر.");
            } finally {
                btn.innerHTML = 'مزامنة وتحديث البيانات <i class="fas fa-sync-alt mr-2"></i>';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
