<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap'); body{font-family:'Tajawal';background:#f8fafc;}</style>
</head>
<body class="max-w-md mx-auto p-6 min-h-screen flex flex-col justify-center">

    <div id="login" class="bg-white p-8 rounded-3xl shadow-xl text-center">
        <h2 class="font-black text-2xl text-slate-800 mb-6">منطقة المحفظين</h2>
        <input type="number" id="pin" class="w-full bg-slate-100 p-4 rounded-xl text-center text-2xl tracking-[10px] font-black outline-none mb-4" placeholder="••••">
        <button onclick="auth()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold">دخول</button>
    </div>

    <div id="panel" class="hidden space-y-4">
        <h2 class="font-black text-xl text-blue-900">رصد جديد</h2>
        <form onsubmit="event.preventDefault(); save();" class="bg-white p-6 rounded-3xl shadow-lg space-y-3">
            <input id="id" type="text" placeholder="ID الطالب" class="w-full border p-3 rounded-xl font-bold">
            <div class="flex gap-2">
                <input id="parts" type="number" placeholder="الأجزاء" class="w-1/3 border p-3 rounded-xl font-bold">
                <input id="today" type="text" placeholder="تسميع اليوم" class="w-2/3 border p-3 rounded-xl font-bold">
            </div>
            <select id="grade" class="w-full border p-3 rounded-xl font-bold bg-white">
                <option>ممتاز مرتفع 🌟</option>
                <option>ممتاز ✅</option>
                <option>جيد جداً 👍</option>
            </select>
            <textarea id="msg" placeholder="ملاحظة..." class="w-full border p-3 rounded-xl font-bold h-20"></textarea>
            <button type="submit" id="sBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black text-lg shadow-lg">حفظ البيانات</button>
        </form>
        <button onclick="location.reload()" class="w-full text-slate-400 text-sm font-bold mt-4">تسجيل خروج</button>
    </div>

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-full shadow-xl text-sm font-bold opacity-0 transition-opacity pointer-events-none">تم الحفظ بنجاح ✅</div>

    <script>
        const api = 'https://script.google.com/macros/s/AKfycbwf899QWPzdMXOHja6NtYVcptvq-FX27a1TnirQVE6x7zXULYJxQGsH07x7oAYI5L_kTg/exec';
        function auth() { if(document.getElementById('pin').value === '2026') { document.getElementById('login').style.display='none'; document.getElementById('panel').classList.remove('hidden'); } }
        
        async function save() {
            const btn = document.getElementById('sBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
            
            const data = {
                action: 'updateScore',
                id: document.getElementById('id').value,
                parts: document.getElementById('parts').value,
                today: document.getElementById('today').value,
                grade: document.getElementById('grade').value,
                studentMsg: document.getElementById('msg').value
            };

            try {
                await fetch(api, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                showToast();
                document.getElementById('id').value = ''; 
                document.getElementById('today').value = '';
            } catch(e) { alert('خطأ'); }
            btn.innerText = 'حفظ البيانات'; btn.disabled = false;
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 3000);
        }
    </script>
</body>
</html>
