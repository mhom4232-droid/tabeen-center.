<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة الحلقات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: #f8fafc; padding-bottom: 90px; }
        .nav-floating { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: #1e3a8a; border-radius: 25px; padding: 15px; display: flex; justify-content: space-around; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .nav-item { color: rgba(255,255,255,0.5); font-size: 20px; } .nav-item.active { color: #d4af37; }
        .mosque-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border-right: 6px solid #1e3a8a; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .mosque-card:hover { transform: translateX(-5px); }
    </style>
</head>
<body class="max-w-md mx-auto p-5">
    <h1 class="text-2xl font-black text-blue-900 mb-6">مراكز التحفيظ</h1>
    
    <div class="mosque-card">
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-black text-lg">مسجد التابعين (الرئيسي)</h3>
            <i class="fas fa-map-marker-alt text-red-500"></i>
        </div>
        <p class="text-xs text-slate-500 font-bold mb-2">نخبة المحفظين:</p>
        <div class="flex flex-wrap gap-2">
            <span class="bg-blue-50 text-blue-700 text-[10px] px-2 py-1 rounded">ناهض العصار</span>
            <span class="bg-blue-50 text-blue-700 text-[10px] px-2 py-1 rounded">محمد العصار</span>
            <span class="bg-blue-50 text-blue-700 text-[10px] px-2 py-1 rounded">أحمد يونس</span>
        </div>
    </div>

    <div class="mosque-card border-r-amber-500" style="border-right-color: #f59e0b;">
        <h3 class="font-black text-lg">مسجد معاذ بن جبل</h3>
        <p class="text-xs text-slate-500 mt-1">بإشراف آل العمصي الكرام</p>
    </div>

    <div class="mosque-card border-r-pink-500 bg-pink-50/30" style="border-right-color: #ec4899;">
        <h3 class="font-black text-lg text-pink-800">مركز التابعين للنساء</h3>
        <p class="text-xs text-pink-600 mt-1">للتواصل: أ. أفنان أبو الحسن</p>
    </div>

    <nav class="nav-floating">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
        <a href="mosques.html" class="nav-item active"><i class="fas fa-mosque"></i></a>
        <a href="student.html" class="nav-item"><i class="fas fa-user-graduate"></i></a>
        <a href="admin.html" class="nav-item"><i class="fas fa-cog"></i></a>
    </nav>
</body>
</html>
