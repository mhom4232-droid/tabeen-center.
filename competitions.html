<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسابقات القرآنية | التابعين</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="p-4 bg-slate-50">
    <div class="official-card bg-slate-900 text-white mb-6 text-center">
        <h2 class="text-xl font-black mb-2">مسابقة "رتل وارتق" 🏆</h2>
        <p class="text-xs text-slate-400">أجب عن الأسئلة واجمع النقاط لتكريمك في لوحة الشرف</p>
    </div>

    <div id="quiz-container" class="official-card border-t-4 border-amber-500">
        <div id="question" class="font-bold text-lg mb-6">جاري تحميل السؤال...</div>
        <div id="options" class="space-y-3"></div>
        <div id="result" class="hidden mt-6 p-4 rounded-xl text-center font-black"></div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-item"><i class="fas fa-home block text-xl"></i>الرئيسية</a>
        <a href="competitions.html" class="nav-item active"><i class="fas fa-trophy block text-xl"></i>المسابقات</a>
        <a href="quran.html" class="nav-item"><i class="fas fa-book-open block text-xl"></i>المصحف</a>
        <a href="student.html" class="nav-item"><i class="fas fa-user block text-xl"></i>ملفي</a>
    </nav>

    <script>
        const questions = [
            { q: "ما هي السورة التي تسمى عروس القرآن؟", a: ["الرحمن", "يس", "الواقعة"], correct: 0 },
            { q: "كم عدد أجزاء القرآن الكريم؟", a: ["20", "30", "60"], correct: 1 },
            { q: "ما هي أطول سورة في القرآن؟", a: ["البقرة", "آل عمران", "النساء"], correct: 0 }
        ];

        let currentQ = 0;
        function loadQ() {
            const q = questions[currentQ];
            document.getElementById('question').innerText = q.q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            q.a.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-4 bg-slate-50 rounded-xl text-right font-bold hover:bg-amber-50 border border-slate-100";
                btn.innerText = opt;
                btn.onclick = () => check(i);
                optDiv.appendChild(btn);
            });
        }

        function check(i) {
            const res = document.getElementById('result');
            res.classList.remove('hidden');
            if(i === questions[currentQ].correct) {
                res.innerText = "إجابة صحيحة! بارك الله فيك ✨";
                res.className = "mt-6 p-4 rounded-xl text-center font-black bg-green-100 text-green-700";
            } else {
                res.innerText = "حاول مرة أخرى يا بطل ❌";
                res.className = "mt-6 p-4 rounded-xl text-center font-black bg-red-100 text-red-700";
            }
            setTimeout(() => {
                currentQ = (currentQ + 1) % questions.length;
                res.classList.add('hidden');
                loadQ();
            }, 2000);
        }
        loadQ();
    </script>
</body>
</html>
