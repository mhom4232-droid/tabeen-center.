<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ملفي | مركز التابعين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: #f1f5f9; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        .nav-floating { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: #1e3a8a; border-radius: 25px; padding: 15px; display: flex; justify-content: space-around; box-shadow: 0 15px 30px rgba(0,0,0,0.2); z-index: 1000; }
        .nav-item { color: rgba(255,255,255,0.5); font-size: 20px; }
        .nav-item.active { color: #d4af37; }
        .card-pro { background: white; border-radius: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); padding: 20px; }
        
        /* Chatbot Style */
        .chat-overlay { position: fixed; bottom: 0; left: 0; width: 100%; height: 0; background: rgba(0,0,0,0.5); z-index: 2000; overflow: hidden; transition: 0.3s; }
        .chat-box { position: absolute; bottom: -100%; left: 0; width: 100%; background: white; border-radius: 30px 30px 0 0; padding: 20px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); height: 70vh; display: flex; flex-direction: column; }
        .chat-open .chat-overlay { height: 100%; }
        .chat-open .chat-box { bottom: 0; }
        .msg { padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; font-size: 13px; max-width: 80%; line-height: 1.5; }
        .msg-ai { background: #f1f5f9; align-self: flex-start; color: #334155; border-bottom-right-radius: 2px; }
        .msg-user { background: #1e3a8a; color: white; align-self: flex-end; border-bottom-left-radius: 2px; }
    </style>
</head>
<body class="max-w-md mx-auto relative">

    <main class="p-4 space-y-5">
        
        <div id="loginSection" class="card-pro text-center mt-20">
            <div class="w-16 h-16 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">🔐</div>
            <h2 class="font-black text-xl text-blue-900 mb-4">الدخول للملف الشخصي</h2>
            <input type="text" id="stdID" class="w-full bg-slate-100 p-4 rounded-xl text-center font-bold outline-none border-2 border-transparent focus:border-blue-500 transition-all mb-4" placeholder="أدخل الكود الخاص بك">
            <button onclick="login()" id="btnL" class="w-full bg-blue-900 text-white p-4 rounded-xl font-black shadow-lg shadow-blue-200">دخول آمن</button>
        </div>

        <div id="dashboard" class="hidden space-y-5 animate-fade-in">
            
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-slate-800" id="name">...</h1>
                    <p class="text-xs text-slate-500 font-bold">طالب مجتهد 🌟</p>
                </div>
                <div class="bg-orange-50 text-orange-600 px-4 py-2 rounded-2xl flex items-center gap-2 font-black text-sm border border-orange-100">
                    <i class="fas fa-fire"></i> <span id="streak">7 أيام</span>
                </div>
            </div>

            <div id="shareCard" class="bg-gradient-to-l from-blue-900 to-blue-700 rounded-[30px] p-6 text-white relative overflow-hidden shadow-xl">
                <div class="relative z-10">
                    <div class="flex justify-between mb-4">
                        <span class="bg-white/20 backdrop-blur px-3 py-1 rounded-full text-[10px] font-bold">الحفظ العام</span>
                        <i class="fas fa-medal text-yellow-300 text-xl"></i>
                    </div>
                    <div class="text-4xl font-black mb-1" id="pct">0%</div>
                    <p class="text-[10px] opacity-70 mb-4">تم إنجاز <span id="parts">0</span> أجزاء</p>
                    <div class="h-2 bg-black/20 rounded-full overflow-hidden">
                        <div id="bar" class="h-full bg-yellow-400 w-0 transition-all duration-1000"></div>
                    </div>
                </div>
                <button onclick="share()" class="absolute bottom-4 left-4 bg-white/10 p-2 rounded-lg backdrop-blur hover:bg-white/20"><i class="fas fa-share-nodes"></i></button>
                <i class="fas fa-quran absolute -right-6 -bottom-10 text-white/5 text-[150px]"></i>
            </div>

            <div onclick="openChat()" class="card-pro bg-white border border-blue-100 flex items-center gap-4 cursor-pointer hover:bg-blue-50 transition-colors">
                <div class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center animate-pulse">
                    <i class="fas fa-robot text-xl"></i>
                </div>
                <div>
                    <h3 class="font-black text-sm text-blue-900">المعلم الذكي</h3>
                    <p class="text-[10px] text-slate-500">اسألني عن التجويد، الحفظ، أو نصيحة...</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="card-pro text-center">
                    <p class="text-[10px] text-slate-400 font-bold mb-1">تسميع اليوم</p>
                    <h4 class="font-black text-sm" id="today">...</h4>
                </div>
                <div class="card-pro text-center border-b-4 border-amber-400">
                    <p class="text-[10px] text-slate-400 font-bold mb-1">التقييم</p>
                    <h4 class="font-black text-lg text-amber-600" id="grade">...</h4>
                </div>
            </div>

        </div>
    </main>

    <div class="chat-overlay" id="chatOverlay">
        <div class="chat-box">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-black text-blue-900"><i class="fas fa-robot text-blue-500 ml-2"></i>المعلم الذكي</h3>
                <button onclick="closeChat()" class="text-slate-400"><i class="fas fa-times"></i></button>
            </div>
            <div id="chatHistory" class="flex-1 overflow-y-auto space-y-2 mb-4">
                <div class="msg msg-ai">أهلاً بك يا بطل! أنا معلمك الذكي، كيف يمكنني مساعدتك في حفظك اليوم؟</div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="userQ" class="flex-1 bg-slate-100 rounded-xl px-4 py-3 text-sm outline-none" placeholder="اكتب سؤالك هنا...">
                <button onclick="askAI()" class="bg-blue-900 text-white w-12 rounded-xl"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <nav class="nav-floating">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
        <a href="mosques.html" class="nav-item"><i class="fas fa-mosque"></i></a>
        <a href="student.html" class="nav-item active"><i class="fas fa-user-graduate"></i></a>
        <a href="admin.html" class="nav-item"><i class="fas fa-cog"></i></a>
    </nav>

    <script>
        const api = 'https://script.google.com/macros/s/AKfycbwf899QWPzdMXOHja6NtYVcptvq-FX27a1TnirQVE6x7zXULYJxQGsH07x7oAYI5L_kTg/exec';

        async function login() {
            const id = document.getElementById('stdID').value;
            const btn = document.getElementById('btnL');
            if(!id) return alert("أدخل الكود");
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
            
            try {
                const res = await fetch(`${api}?action=getStudent&id=${id}`);
                const data = await res.json();
                if(data.found) {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    
                    document.getElementById('name').innerText = data.name.split(' ')[0]; // First name only
                    document.getElementById('parts').innerText = data.parts;
                    document.getElementById('today').innerText = data.today || "بانتظار الرصد";
                    document.getElementById('grade').innerText = data.grade || "-";
                    
                    const p = parseInt(data.parts) || 0;
                    const pct = Math.round((p/30)*100);
                    document.getElementById('pct').innerText = pct + "%";
                    document.getElementById('bar').style.width = pct + "%";
                    
                    if(data.grade.includes("ممتاز")) confetti({ particleCount: 100, spread: 70 });
                } else { alert("الكود غير صحيح"); btn.innerText = "دخول آمن"; }
            } catch(e) { alert("خطأ اتصال"); btn.innerText = "دخول آمن"; }
        }

        function share() {
            html2canvas(document.querySelector("#shareCard")).then(canvas => {
                const link = document.createElement('a'); link.download = 'my-progress.png'; link.href = canvas.toDataURL(); link.click();
            });
        }

        // --- AI Smart Teacher Logic (Client Side Simulation) ---
        // في الواقع الحقيقي، هنا يتم استدعاء Gemini API. 
        // هنا سأضع "منطق ذكي" يحاكي الذكاء الاصطناعي ليعمل بدون تكلفة سيرفر
        function openChat() { document.body.classList.add('chat-open'); }
        function closeChat() { document.body.classList.remove('chat-open'); }
        
        function askAI() {
            const input = document.getElementById('userQ');
            const history = document.getElementById('chatHistory');
            const q = input.value.trim();
            if(!q) return;

            // User msg
            history.innerHTML += `<div class="msg msg-user self-end">${q}</div>`;
            input.value = '';
            history.scrollTop = history.scrollHeight;

            // AI Logic (Simulated Intelligence)
            setTimeout(() => {
                let ans = "سؤال ممتاز! دعني أفكر...";
                if(q.includes("نسي") || q.includes("أنسى")) ans = "النسيان طبيعي يا بطل! الحل هو: 1. كثرة التكرار. 2. الصلاة بالمحفوظ. 3. الدعاء. هل جربت التسميع لصديق؟";
                else if(q.includes("صعب") || q.includes("مش قادر")) ans = "القرآن يسير لمن يسره الله عليه. ابدأ بآيات قليلة، وكررها كثيراً. وتذكر: 'الماهر بالقرآن مع السفرة الكرام البررة'.";
                else if(q.includes("غن") || q.includes("مد")) ans = "أحكام التجويد زينة القرآن. الغنة تخرج من الخيشوم بمقدار حركتين، والمدود تزيد الصوت جمالاً. هل تريد شرحاً لحكم محدد؟";
                else if(q.includes("شكرا") || q.includes("جزاك")) ans = "وإياكم يا بطل! أنا هنا دائماً لمساعدتك.";
                else ans = "بارك الله في حرصك. أنصحك بمراجعة محفظك الشيخ في الحلقة لهذا الأمر الدقيق، واحرص على المراجعة اليومية.";

                history.innerHTML += `<div class="msg msg-ai">${ans}</div>`;
                history.scrollTop = history.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
